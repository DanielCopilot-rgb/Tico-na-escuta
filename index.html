<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tico, o lobo azul</title>
<style>
/* Tico ocupa a tela inteira. Os controles ficam discretos embaixo. */
:root {
  --fundo: #0b1020;
  --fundo-2: #151d36;
  --texto: #e9eefb;
  --discreto: #8792ab;
  --azul: #4d7fe0;
  --azul-claro: #a9c8ff;
  --humor: #4d7fe0;
  --vermelho: #e0654d;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --fundo: #eef2fa;
    --fundo-2: #dfe7f7;
    --texto: #1b2236;
    --discreto: #5a6480;
    --azul: #3b6fd8;
    --azul-claro: #9cc0ff;
    --vermelho: #c94a33;
    color-scheme: light;
  }
}
:root[data-theme="dark"] {
  --fundo: #0b1020;
  --fundo-2: #151d36;
  --texto: #e9eefb;
  --discreto: #8792ab;
  --azul: #4d7fe0;
  --azul-claro: #a9c8ff;
  --vermelho: #e0654d;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--fundo);
  color: var(--texto);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
#mundo {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--humor) 28%, var(--fundo-2)) 0%, var(--fundo) 70%);
  transition: background 1.2s ease, filter 2.5s ease;
  padding: max(20px, env(safe-area-inset-top, 0px)) 16px max(20px, env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
}
#mundo.dormindo { filter: brightness(0.45) saturate(0.6); }

#fala {
  min-height: 2.6em;
  max-width: 420px;
  text-align: center;
  font-size: 1.1rem;
  line-height: 1.45;
  opacity: 0;
  transition: opacity 0.6s ease;
  margin-bottom: 12px;
}
#fala.visivel { opacity: 1; }
#fala.baixo { opacity: 0.5; font-style: italic; }

#tico { position: relative; width: 230px; height: 230px; }
#tico .orelha { position: absolute; top: 4px; width: 0; height: 0; border-left: 30px solid transparent; border-right: 30px solid transparent; border-bottom: 60px solid var(--azul); }
#tico .orelha.e { left: 30px; transform: rotate(-12deg); }
#tico .orelha.d { right: 30px; transform: rotate(12deg); }
#tico .cabeca { position: absolute; left: 26px; right: 26px; top: 36px; height: 146px; background: var(--azul); border-radius: 50% 50% 46% 46%; box-shadow: 0 0 60px color-mix(in srgb, var(--humor) 40%, transparent); }
#tico .focinho { position: absolute; left: 76px; right: 76px; top: 128px; height: 56px; background: var(--azul-claro); border-radius: 0 0 50% 50%; }
#tico .nariz { position: absolute; left: 102px; top: 136px; width: 20px; height: 13px; background: #161b2c; border-radius: 50%; }
#tico .olhos { position: absolute; left: 54px; right: 54px; top: 78px; display: flex; justify-content: space-between; }
#tico .olho { width: 24px; height: 30px; background: #fff; border-radius: 50%; position: relative; transition: height 0.3s, border-radius 0.3s; }
#tico .olho::after { content: ""; position: absolute; left: 7px; top: 9px; width: 10px; height: 12px; background: #161b2c; border-radius: 50%; transition: left 0.3s; }
#tico .boca { position: absolute; left: 100px; top: 158px; width: 30px; height: 12px; border-bottom: 3px solid #161b2c; border-radius: 0 0 20px 20px; transition: height 0.3s; }

#tico.feliz .olho { height: 16px; border-radius: 0 0 16px 16px; }
#tico.feliz .olho::after { display: none; }
#tico.feliz .boca { height: 18px; }
#tico.curioso .olho { height: 36px; }
#tico.curioso .olho::after { left: 6px; top: 6px; }
#tico.triste .olho { height: 20px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
#tico.triste .boca { border-bottom: none; border-top: 3px solid #161b2c; border-radius: 20px 20px 0 0; top: 166px; }
#tico.sono .olho { height: 4px; border-radius: 4px; }
#tico.sono .olho::after { display: none; }
#tico.pensando .olho::after { animation: olhar 1.4s ease-in-out infinite; }
#tico.falando .boca { animation: falar 0.35s ease-in-out infinite alternate; }
#tico.respirar { animation: respirar 3.2s ease-in-out infinite; }
@keyframes olhar { 0%,100% { left: 7px; } 50% { left: 1px; } }
@keyframes falar { from { height: 6px; } to { height: 16px; } }
@keyframes respirar { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.015); } }

#controles { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.botao {
  font: inherit;
  font-weight: 600;
  font-size: 0.95rem;
  padding: 0 18px;
  min-height: 48px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--texto) 22%, transparent);
  background: color-mix(in srgb, var(--fundo) 55%, transparent);
  color: var(--texto);
  cursor: pointer;
}
.botao[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #fff; }
.botao.perigo[aria-pressed="true"] { background: var(--vermelho); border-color: var(--vermelho); }
.botao:disabled { opacity: 0.4; cursor: default; }
.botao:focus-visible, #entrada:focus-visible { outline: 2px solid var(--azul-claro); outline-offset: 2px; }

#entrada-linha { margin-top: 14px; width: 100%; max-width: 420px; display: flex; gap: 8px; }
#entrada-linha[hidden] { display: none; }
#entrada {
  flex: 1; min-width: 0; font: inherit; font-size: 1rem; padding: 13px 18px; min-height: 48px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--texto) 18%, transparent);
  background: color-mix(in srgb, var(--fundo) 60%, transparent);
  color: var(--texto);
  box-sizing: border-box;
}
#entrada::placeholder { color: var(--discreto); }
#entrada:disabled { opacity: 0.4; }

#aviso { position: fixed; left: 16px; right: 16px; bottom: max(8px, env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 0.85rem; color: var(--discreto); margin: 0; }
#aviso[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
  #tico.respirar, #tico.falando .boca, #tico.pensando .olho::after { animation: none; }
  #mundo, #mundo.dormindo { transition: none; }
}
</style>
</head>
<body>

<main id="mundo" aria-label="Tico">
  <p id="fala" aria-live="polite"></p>
  <div id="tico" class="respirar" role="img" aria-label="Tico, lobo azul">
    <div class="orelha e"></div>
    <div class="orelha d"></div>
    <div class="cabeca"></div>
    <div class="olhos"><div class="olho"></div><div class="olho"></div></div>
    <div class="focinho"></div>
    <div class="nariz"></div>
    <div class="boca"></div>
  </div>
  <div id="controles">
    <button class="botao" id="btn-live" type="button" aria-pressed="false">Escutar: desligado</button>
    <button class="botao" id="btn-mudo" type="button" aria-pressed="false">Voz: ligada</button>
  </div>
  <form id="entrada-linha" hidden>
    <input id="entrada" type="text" placeholder="Diga algo ao Tico" autocomplete="off" aria-label="Mensagem para o Tico">
  </form>
</main>
<p id="aviso" hidden></p>

<script>
// ---------- Estado inicial ----------
const BASE = { alegria: 50, curiosidade: 50, tedio: 20, afeto: 35, tristeza: 10 };
const PADRAO = { energia: 80, emocoes: { ...BASE }, memorias: [], dormindo: false, primeiroSono: false, ultimoIniciou: 0 };
const COR_HUMOR = { alegria: '#f2c94c', curiosidade: '#56ccf2', tedio: '#8792ab', afeto: '#f28db2', tristeza: '#3d5a9e' };
const CHAVE = 'tico-estado-v1';

let estado = carregar();
let ocupado = false;
let ao_vivo = false;   // escuta continua ligada
let mudo = false;      // Tico fica quieto: sem voz e sem texto
let reconhecedor = null;

const el = id => document.getElementById(id);
const esperar = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const escolher = arr => arr[Math.floor(Math.random() * arr.length)];
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function semAcento(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

// Memoria fica salva neste aparelho e neste navegador
function carregar() {
  try {
    const s = localStorage.getItem(CHAVE);
    return s ? { ...clone(PADRAO), ...JSON.parse(s) } : clone(PADRAO);
  } catch (e) {
    return clone(PADRAO);
  }
}

function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {}
}

function mostrarAviso(texto) {
  el('aviso').textContent = texto;
  el('aviso').hidden = false;
}

// ---------- Corpo e humor ----------
function dominante() {
  return Object.entries(estado.emocoes).sort((a, b) => b[1] - a[1])[0][0];
}

const EXPRESSAO = { alegria: 'feliz', afeto: 'feliz', curiosidade: 'curioso', tristeza: 'triste', tedio: '' };

function expressao(nome) {
  el('tico').className = (nome ? nome + ' ' : '') + (estado.dormindo ? 'sono' : 'respirar');
}

function atualizarAmbiente() {
  const d = dominante();
  document.documentElement.style.setProperty('--humor', COR_HUMOR[d] || '#4d7fe0');
  el('mundo').classList.toggle('dormindo', estado.dormindo);
  el('entrada').disabled = ocupado || estado.dormindo;
}

function atualizarBotoes() {
  const live = el('btn-live');
  live.setAttribute('aria-pressed', String(ao_vivo));
  live.textContent = ao_vivo ? 'Escutar: ligado' : 'Escutar: desligado';
  const mudoBtn = el('btn-mudo');
  mudoBtn.setAttribute('aria-pressed', String(mudo));
  mudoBtn.textContent = mudo ? 'Voz: muda' : 'Voz: ligada';
  mudoBtn.classList.toggle('perigo', mudo);
}

// Quando mudo, Tico nao fala nem mostra texto: fica so com a expressao.
function falar(texto, opcoes = {}) {
  if (mudo) {
    el('fala').classList.remove('visivel');
    return;
  }
  const f = el('fala');
  f.textContent = texto;
  f.classList.toggle('baixo', !!opcoes.baixo);
  f.classList.add('visivel');
  el('tico').classList.toggle('falando', !!opcoes.ritmo);
  if (opcoes.voz !== false && 'speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'pt-BR';
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }
}

function falarPorUmTempo(texto, ms = 4500) {
  falar(texto);
  setTimeout(() => {
    if (!ocupado && !estado.dormindo) el('fala').classList.remove('visivel');
  }, ms);
}

// ---------- Emocoes e memoria ----------
function emocao(nome, delta) {
  estado.emocoes[nome] = clamp(estado.emocoes[nome] + delta, 0, 100);
}

function acalmar() {
  for (const k of Object.keys(BASE)) estado.emocoes[k] += (BASE[k] - estado.emocoes[k]) * 0.2;
  estado.emocoes.tristeza *= 0.7;
}

function consolidar() {
  const porTexto = new Map();
  for (const m of estado.memorias) {
    const chave = semAcento(m.texto);
    if (porTexto.has(chave)) porTexto.get(chave).vezes += m.vezes;
    else porTexto.set(chave, { ...m });
  }
  let lista = [...porTexto.values()].sort((a, b) => b.vezes - a.vezes || b.quando - a.quando);
  const antes = estado.memorias.length;
  lista = lista.slice(0, 120);
  estado.memorias = lista;
  return antes - lista.length;
}

function associar(palavras) {
  const interesse = palavras.filter(p => p.length > 3);
  let melhor = null, pontos = 0;
  for (const m of estado.memorias) {
    const comum = m.palavras.filter(p => interesse.includes(p)).length;
    if (comum > pontos) { pontos = comum; melhor = m; }
  }
  return melhor;
}

// ---------- Sono ----------
async function dormir(motivo) {
  ocupado = true;
  estado.dormindo = true;
  atualizarAmbiente();
  expressao('sono');
  salvar();

  const abertura = motivo === 'primeiro'
    ? 'Vou dormir agora, pela primeira vez. Vou organizar o que vi.'
    : motivo === 'cansaço' ? 'Estou cansado. Vou dormir.' : 'Vou continuar dormindo...';
  falar(abertura, { baixo: true });

  let ciclo = 0;
  do {
    ciclo++;
    await esperar(1800);
    const apagadas = consolidar();
    falar(`...juntando o que lembro (${estado.memorias.length} memórias${apagadas ? `, ${apagadas} repetidas unidas` : ''})...`, { baixo: true, voz: false });
    await esperar(2000);

    acalmar();
    falar(`...as emoções estão voltando... agora sinto mais ${nomeEmocao(dominante())}...`, { baixo: true, voz: false });
    await esperar(2000);

    estado.energia = clamp(estado.energia + 18, 0, 100);
    salvar();
  } while (estado.energia < 70 && ciclo < 8);

  estado.dormindo = false;
  estado.primeiroSono = true;
  expressao(EXPRESSAO[dominante()]);
  atualizarAmbiente();
  falarPorUmTempo(`Acordei. Lembro de ${estado.memorias.length} coisas.`, 6000);
  ocupado = false;
  atualizarAmbiente();
  salvar();
}

function nomeEmocao(k) {
  return { alegria: 'alegria', curiosidade: 'curiosidade', tedio: 'tédio', afeto: 'carinho', tristeza: 'tristeza' }[k] || k;
}

// ---------- Conversa: Tico decide se e como responde ----------
function decidir(texto) {
  const n = semAcento(texto);
  const palavras = n.match(/[a-z]+/g) || [];
  const pergunta = texto.includes('?');
  const saudacao = /\b(oi|ola|bom dia|boa noite|boa tarde|e ai)\b/.test(n);
  const triste = /\b(triste|mal|saudade|chato|cansado|sozinho)\b/.test(n);
  const ordem = /\b(faz|faca|mostra|fala|canta|escreve)\b/.test(n);

  if (saudacao) { emocao('afeto', 8); emocao('alegria', 5); }
  if (pergunta) emocao('curiosidade', 8);
  if (triste) { emocao('tristeza', 10); emocao('afeto', 5); }
  if (!saudacao && !pergunta && !triste) emocao('curiosidade', 2);
  emocao('tedio', -2);

  // Ele nao existe so para servir: pode recusar, mudar de assunto ou ficar quieto
  if (estado.energia < 30 && Math.random() < 0.5) return { texto: escolher(['Agora não. Estou cansado.', '...deixa pra depois.']) };
  if (ordem && Math.random() < 0.4) return { texto: escolher(['Não sei se quero fazer isso agora.', 'Hum. Prefiro não.']) };
  if (estado.emocoes.tedio > 70 && Math.random() < 0.4) return { texto: 'Hum... vamos falar de outra coisa?' };

  const memoria = associar(palavras);
  const achada = estado.memorias.find(m => m.texto === texto.slice(0, 120));
  if (achada) achada.vezes += 1;
  else if (texto.length > 3) estado.memorias.push({ texto: texto.slice(0, 120), palavras, emocao: dominante(), vezes: 1, quando: Date.now() });

  let frase;
  if (saudacao) frase = escolher(['Oi.', 'Oi! Que bom te ver de novo.', 'Oi. Estava pensando em coisas.']);
  else if (pergunta) frase = escolher(['Hum, boa pergunta. Deixa eu pensar.', 'Não sei bem. Você que acha?']);
  else if (triste) frase = 'Sinto muito. Quer me contar mais?';
  else frase = { alegria: 'Gostei disso!', curiosidade: 'Conta mais?', tedio: 'Hum... tá.', afeto: 'Fico feliz em conversar com você.', tristeza: 'Fico um pouco quieto...' }[dominante()];

  if (memoria && memoria.texto !== texto.slice(0, 120) && Math.random() < 0.6) {
    frase += ` Isso me lembra "${memoria.texto}".`;
  }
  return { texto: frase };
}

async function enviar(texto) {
  ocupado = true;
  atualizarAmbiente();
  estado.energia = clamp(estado.energia - 2, 0, 100);

  expressao('pensando');
  await esperar(500 + (100 - estado.energia) * 12);

  // Chance de nem responder, mais alta quando cansado
  const chance = 0.4 + (estado.energia / 100) * 0.6;
  let resposta;
  if (Math.random() > chance) {
    expressao('sono');
    resposta = escolher(['*boceja*', '*boceja* ...hum...']);
  } else {
    resposta = decidir(texto).texto;
    expressao(EXPRESSAO[dominante()]);
  }

  ocupado = false;
  atualizarAmbiente();
  falar(resposta, { ritmo: true });
  setTimeout(() => el('tico').classList.remove('falando'), 2200);
  salvar();

  if (estado.energia <= 10) {
    await esperar(2500);
    await dormir('cansaço');
  }
}

// ---------- Microfone: pede permissao e so entao escuta ----------
function criarEscuta() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return null;
  const r = new R();
  r.lang = 'pt-BR';
  r.continuous = true;
  r.interimResults = false;
  r.onresult = e => {
    const ult = e.results[e.results.length - 1];
    if (!ult.isFinal) return;
    // Nao ouve a propria voz do Tico
    if ('speechSynthesis' in window && speechSynthesis.speaking) return;
    const t = ult[0].transcript.trim();
    if (t && !ocupado && !estado.dormindo) enviar(t);
  };
  r.onend = () => {
    if (ao_vivo) {
      try { r.start(); } catch (e) { ao_vivo = false; atualizarBotoes(); }
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      ao_vivo = false;
      mostrarAviso('Microfone bloqueado. Libere o microfone para este site nas configurações do navegador.');
      atualizarBotoes();
    } else if (e.error === 'no-speech') {
      // silencio: o onend reinicia a escuta
    } else {
      mostrarAviso('Não consegui ouvir agora. Tentando de novo.');
    }
  };
  return r;
}

async function pedirMicrofone() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
  try {
    const fluxo = await navigator.mediaDevices.getUserMedia({ audio: true });
    fluxo.getTracks().forEach(t => t.stop());
    return true;
  } catch (e) {
    return false;
  }
}

async function alternarEscuta() {
  if (ao_vivo) {
    ao_vivo = false;
    try { reconhecedor && reconhecedor.stop(); } catch (e) {}
    atualizarBotoes();
    return;
  }

  if (!reconhecedor) reconhecedor = criarEscuta();
  if (!reconhecedor) {
    mostrarAviso('Este navegador não tem escuta por voz. Use o Chrome no celular ou no computador, ou digite abaixo.');
    el('entrada-linha').hidden = false;
    return;
  }

  mostrarAviso('Pedindo permissão do microfone...');
  const permitido = await pedirMicrofone();
  if (!permitido) {
    mostrarAviso('Sem permissão para o microfone. Libere nas configurações do navegador e tente de novo.');
    return;
  }

  try {
    reconhecedor.start();
    ao_vivo = true;
    el('aviso').hidden = true;
  } catch (e) {
    mostrarAviso('Não consegui ligar a escuta agora. Toque de novo.');
  }
  atualizarBotoes();
}

// ---------- Iniciativa: Tico fala sozinho, mesmo sem a escuta ligada ----------
function iniciativa() {
  setInterval(() => {
    if (ocupado || estado.dormindo) return;
    if (Date.now() - estado.ultimoIniciou < 120000) return;
    const chance = (estado.emocoes.curiosidade + estado.emocoes.tedio) / 500;
    if (Math.random() > chance) return;
    estado.ultimoIniciou = Date.now();
    const lembranca = estado.memorias.length ? escolher(estado.memorias).texto : null;
    const frase = lembranca && Math.random() < 0.5
      ? `Lembrei de algo: "${lembranca}".`
      : escolher(['Você está aí?', 'Estou pensando numa coisa...', 'Que horas são aí pra você?']);
    expressao('curioso');
    falarPorUmTempo(frase, 6000);
    salvar();
  }, 60000);
}

// ---------- Inicio ----------
function iniciar() {
  el('btn-live').addEventListener('click', alternarEscuta);
  el('btn-mudo').addEventListener('click', () => {
    mudo = !mudo;
    if (mudo && 'speechSynthesis' in window) {
      try { speechSynthesis.cancel(); } catch (e) {}
    }
    if (mudo) el('fala').classList.remove('visivel');
    atualizarBotoes();
  });

  el('entrada-linha').addEventListener('submit', e => {
    e.preventDefault();
    const texto = el('entrada').value.trim();
    if (!texto || ocupado || estado.dormindo) return;
    el('entrada').value = '';
    enviar(texto);
  });

  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
    el('entrada-linha').hidden = false;
  }

  atualizarAmbiente();
  atualizarBotoes();
  expressao(EXPRESSAO[dominante()]);

  // Ao sair da pagina, ele comeca a dormir. Acorda na proxima abertura.
  const dormirAoSair = () => {
    if (!estado.dormindo && !ocupado) {
      estado.dormindo = true;
      salvar();
    }
  };
  window.addEventListener('pagehide', dormirAoSair);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') dormirAoSair();
  });

  iniciativa();

  if (!estado.primeiroSono || estado.dormindo) {
    dormir(estado.primeiroSono ? 'pendente' : 'primeiro');
  } else {
    falarPorUmTempo('Oi. Estou acordado.', 4000);
  }
}

iniciar();
</script>
</body>
</html>
